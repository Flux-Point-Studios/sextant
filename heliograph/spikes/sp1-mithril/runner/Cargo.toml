# M0 executor — SP1 host-side runner (BENCH.md §4.1 "execute" stage, no proving).
# Executes the instrumented guest ELF via sp1-sdk and differentials the verdict
# against native Sextant (mithril-stm 0.10.5 + blst) in the same process.
[package]
name = "sp1-mithril-runner"
version = "0.1.0"
edition = "2021"
publish = false

[workspace]

[features]
# Flips SP1's build-time cfg from the native child executor (which drops
# cycle-tracker spans) to the portable executor, and turns on the tracker
# plumbing in sp1-prover, so ExecutionReport.cycle_tracker carries the
# stage split.
profiling = ["sp1-sdk/profiling"]

[dependencies]
sp1-sdk = { version = "6.1.0", features = ["blocking"] }
sextant = { git = "https://github.com/Flux-Point-Studios/sextant", rev = "90b2672aa3ee7a957ecaee0e33026337825efafa", default-features = false, features = ["mithril"] }
sha2 = "0.10"
hex = "0.4"
serde_json = "1"
