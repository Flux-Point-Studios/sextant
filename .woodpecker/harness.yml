when:
  - event: [push, pull_request, manual]

steps:
  - name: harness
    image: rust:1.93-bookworm
    commands:
      - rustup component add clippy rustfmt
      - rustup target add wasm32-unknown-unknown
      # The harness runs the wasm32 module under a pinned Node.
      - curl --fail --location --proto '=https' --tlsv1.2 https://nodejs.org/download/release/v24.13.1/node-v24.13.1-linux-x64.tar.xz -o /tmp/node.tar.xz
      - echo '30215f90ea3cd04dfbc06e762c021393fa173a1d392974298bbc871a8e461089  /tmp/node.tar.xz' | sha256sum -c -
      - tar -xJf /tmp/node.tar.xz --strip-components=1 -C /usr/local
      - echo 'd95de52ccb76fb2c5775bf176f29f3025e4b19352c092aad51ce5d930717359f  /usr/local/bin/node' | sha256sum -c -
      - bash scripts/harness.sh --full
